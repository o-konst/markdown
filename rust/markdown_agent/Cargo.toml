[package]
name = "markdown_agent"
version = "0.1.0"
edition = "2021"
publish = false
description = "Claude agent loop over the notes vault, shared by the macOS and Windows apps"

[dependencies]
markdown_vault = { path = "../markdown_vault" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Blocking client on purpose: the turn runs on its own thread and the host drains events,
# so there is no reason to pull an async runtime into the apps' static library.
# rustls rather than native-tls keeps OpenSSL out of the iOS and Windows cross-builds.
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }

[dev-dependencies]
tempfile = "3"
